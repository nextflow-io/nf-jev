plugins {
    id 'io.nextflow.nextflow-plugin' version '1.0.0-beta.15'
}

version = '0.1.0'

dependencies {
    // the all-in-one wiremock jar; exclude groovy-all so it does not clash with the Groovy runtime
    testImplementation('org.wiremock:wiremock-standalone:3.13.2') { exclude module: 'groovy-all' }
}

nextflowPlugin {
    nextflowVersion = '25.10.0'

    provider = 'nextflow-io'
    className = 'nextflowio.plugin.JevPlugin'
    description = 'Calibrated judgments from TypeSafe System One as Nextflow functions'
    extensionPoints = [
        'nextflowio.plugin.JevExtension'
    ]

    registry {
        // From the environment only - `make` sources .env into it. Set here because this block
        // outranks every other source the release task consults, so gradle.properties is never
        // reached; and never as a command-line property, which would put the token in the
        // process list.
        apiKey = System.getenv('NPR_API_KEY')
        url = System.getenv('NPR_API_URL')
    }
}
